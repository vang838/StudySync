services:
  postgres:
    image: postgres:17
    container_name: studysync-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studysync}
      POSTGRES_USER: ${POSTGRES_USER:-studysync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studysync}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-studysync} -d ${POSTGRES_DB:-studysync}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: studysync-searxng
    restart: unless-stopped

    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is required}

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./infra/searxng:/etc/searxng
      - searxng_cache:/var/cache/searxng

volumes:
  postgres_data:
    name: studysync-postgres-data

  searxng_cache:
    name: studysync-searxng-cache