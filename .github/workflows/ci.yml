name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and migration history
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: development
      DATABASE_URL: sqlite:///./ci-test.sqlite
      UWM_CATALOG_SYNC_ON_STARTUP: "false"
      JWT_SECRET: ci-only-test-secret

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check Alembic revision graph
        run: |
          uv run --no-sync python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          assert len(heads) == 1, f"Expected one Alembic head, found: {heads}"
          print(f"Alembic head: {heads[0]}")
          PY

      - name: Run backend tests
        run: uv run --no-sync python -m pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
